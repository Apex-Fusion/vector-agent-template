name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # libsodium-wrappers-sumo (transitive via @lucid-evolution/lucid) imports
      # "./libsodium-sumo.mjs" from its wrapper, but pnpm's strict store layout
      # puts that file in the sibling package libsodium-sumo, so every test that
      # loads lucid fails to import it. agent/Dockerfile patches the image with
      # the same copy; this step does it for the test run, version for version.
      - name: patch the libsodium wrapper, as agent/Dockerfile does
        run: |
          set -e
          found=0
          for dst in node_modules/.pnpm/libsodium-wrappers-sumo@*/node_modules/libsodium-wrappers-sumo/dist/modules-sumo-esm; do
            [ -d "$dst" ] || continue
            version=$(echo "$dst" | sed -n 's#^node_modules/.pnpm/libsodium-wrappers-sumo@\([^/]*\)/.*#\1#p')
            src="node_modules/.pnpm/libsodium-sumo@$version/node_modules/libsodium-sumo/dist/modules-sumo-esm/libsodium-sumo.mjs"
            [ -f "$src" ] || { echo "libsodium-sumo@$version not found for $dst"; exit 1; }
            cp "$src" "$dst/"
            echo "patched libsodium wrapper $version"
            found=1
          done
          [ "$found" -eq 1 ] || { echo "no libsodium-wrappers-sumo in the store"; exit 1; }
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present test
      - run: bash scripts/lint-public-prose.sh
      - run: docker build -f agent/Dockerfile -t vector-agent-template:ci .
      # The compiled validator blueprint must be INSIDE the image.
      # loadBlueprint() is called lazily, deep inside the live tx builders, so
      # an image that is missing contracts/marketplace/plutus.json still builds
      # green and still boots green - and then fails on the first real job,
      # with the buyer's funds already locked in an escrow. Load it here so a
      # missing blueprint fails the build instead of a stranger's first sale.
      - name: blueprint loads inside the image
        run: >-
          docker run --rm --entrypoint sh vector-agent-template:ci -c "cd packages/shared && ../../node_modules/.bin/tsx -e \"import('./src/tx/blueprint.js').then(m=>{m.loadBlueprint();console.log('blueprint OK')}).catch(e=>{console.error('blueprint FAILED - '+e.message);process.exit(1)})\""
